name: Server update command tests

on:
  workflow_dispatch:
  pull_request:
    branches: [preview]
    paths:
      - scripts/hangar-update.py
      - scripts/tests/test_hangar_update*.py
      - .github/workflows/server-update-tests.yml
      - docs/server-updates.md
  push:
    branches: [preview]
    paths:
      - scripts/hangar-update.py
      - scripts/tests/test_hangar_update*.py
      - .github/workflows/server-update-tests.yml
      - docs/server-updates.md

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.2
      - name: Test deployment failures and rollback
        run: python3 -m unittest discover -s scripts/tests -p 'test_hangar_update*.py' -v
      - name: Exercise backup, image update, migration guard and rollback with disposable Docker services
        env:
          HANGAR_UPDATE_DOCKER_TEST: "1"
        run: python3 -m unittest discover -s scripts/tests -p 'test_hangar_update_docker.py' -v
